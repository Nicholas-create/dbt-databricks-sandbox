<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Best AI Model · Nicholas Sampson</title>
  <meta name="description" content="Which AI model is best at coding, writing, maths, science, reasoning and real work? Notable models ranked on benchmarks collected by Epoch AI.">
  <!-- Apply a saved theme before first paint, so a dark-mode visitor never sees a flash of light. -->
  <script>try { const t = localStorage.getItem("theme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch {}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="#">Nicholas Sampson</a>
    <!-- In the sticky header so the category is switchable from any section of the page. -->
    <nav class="categories" role="tablist" aria-label="Category"></nav>
    <nav class="header-nav">
      <div class="theme-switch" role="group" aria-label="Theme">
        <button type="button" data-theme-choice="system" aria-label="System theme" title="System">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M8.5 20h7M12 16.5V20"/></svg>
        </button>
        <button type="button" data-theme-choice="light" aria-label="Light theme" title="Light">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
        </button>
        <button type="button" data-theme-choice="dark" aria-label="Dark theme" title="Dark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        </button>
      </div>
      <a class="header-link" href="https://github.com/Nicholas-create/dbt-databricks-sandbox">Code <span aria-hidden="true">↗</span></a>
    </nav>
  </header>

  <main>
    <!-- One title for the whole page, pinned under the header. Scrolling toward the second section
         swaps its wording (the leaderboard's question out, the race's title in), tied to scroll
         position: no snapping, and scrolling back reverses it. -->
    <div class="title-bar">
      <div class="title-inner">
        <h1 id="board-title" class="title-a">Which model is best <em class="phrase">at coding</em>?</h1>
        <p class="title-b" aria-hidden="true">Best <em data-race-phrase>overall</em>, over time</p>
        <!-- 3D category emblem: in the pinned row (above its background, so it's never cut in half);
             it fades away as you start scrolling and returns at the top. -->
        <div class="emblem-wrap" aria-hidden="true"><canvas class="emblem"></canvas></div>
      </div>
    </div>

    <section class="board" aria-labelledby="board-title">
      <div class="hero"></div> <!-- keeps the emblem's overhang clear of the pills and legend -->

      <div class="bench-pills" role="tablist" aria-label="Benchmark"></div>

      <div class="meta-row">
        <div class="legend" aria-label="Legend">
          <div class="companies" aria-label="Companies"></div>
          <span class="legend-rule" aria-hidden="true"></span>
          <span class="key"><i class="swatch swatch-closed"></i>Closed</span>
          <span class="key"><i class="swatch swatch-open"></i>Open weights</span>
        </div>
      </div>

      <!-- The chart takes whatever height is left on screen; "Show all" scrolls inside it, never the page. -->
      <div class="chart-frame">
        <div class="chart" role="list" aria-label="Models ranked by score">
          <div class="axis" aria-hidden="true"></div>
        </div>
      </div>
      <div class="axis-scale" aria-hidden="true"></div>
      <div class="chart-actions">
        <button class="show-all" type="button"></button>
        <p class="pin-note" aria-live="polite" hidden></p>
        <!-- CC BY 4.0 requires visible credit; this is the short form. app.js puts the full notice and date on hover. -->
        <a class="credit" href="https://epoch.ai/benchmarks" data-stat="generated">Data: Epoch AI (CC BY 4.0) · * reported by the developer</a>
      </div>
      <div class="tooltip" role="status" hidden></div>
    </section>

    <!-- Best over time: one line per company, its best model so far. Follows the category tabs above. -->
    <section class="race" aria-labelledby="race-title">
      <h2 id="race-title" class="visually-hidden">Best <em class="phrase">overall</em>, over time</h2> <!-- shown by the pinned title above -->
      <div class="race-chart"></div>
      <div class="visually-hidden"><table class="race-table"></table></div> <!-- a table ignores a 1px width, so the wrapper does the hiding -->
      <div class="tooltip" role="status" hidden></div>
    </section>
  </main>

</body>
</html>
