version: 2

seeds:
  - name: model_match_overrides
    description: "Manual OpenRouter → model list pairings for models that automatic name matching misses. Each row records the reasoning in match_note."
    columns:
      - name: openrouter_model_id
        description: "OpenRouter model ID. Primary key: each OpenRouter model maps to at most one model."
        data_tests:
          - unique
          - not_null
      - name: model_name
        description: "Exact name in the model list (seed manual_models) this OpenRouter model represents."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('manual_models')
                field: model_name

  - name: benchmark_categories
    description: "Site categories, in tab order. `phrase` completes the title 'Which model is best ___?'."
    config:
      column_types:
        sort_order: int
        is_on_site: boolean
        overall_weight: double
    columns:
      - name: category_id
        description: "Primary key."
        data_tests:
          - unique
          - not_null
      - name: is_on_site
        description: "False for a category kept in the database but not shown on the site, e.g. 'internal': a developer's own evaluations, which only ever score that developer's models, so they can't rank models across labs."
      - name: overall_weight
        description: >
          How much the category counts in the Overall score, relative to the others. 1 everywhere
          = every skill area counts equally, however many benchmarks it has (Agents has seven
          times as many as Writing). 0 = left out: 'overall' itself (it is the result) and
          'internal' (not comparable across labs). Edit to tilt the Overall, e.g. 2 for a
          category that should count double. Never negative
          (tests/assert_benchmark_weights_are_valid.sql).
        data_tests:
          - not_null
