version: 2

models:
  - name: stg_manual__benchmark_scores
    description: >
      Hand-entered scores from model release pages, tidied from the seed `manual_benchmark_scores`.
      One row per benchmark and model. Scores stay as published (49.1 = 49.1%).
    columns:
      - name: benchmark_model_key
        description: >
          benchmark_id + normalised model name (macro model_match_key). Primary key. Tested here,
          not on the seed, because two spellings of one model ("GPT-5" / "GPT 5") only collide
          once the name is normalised.
        data_tests:
          - unique
          - not_null

  - name: stg_manual__models
    description: "Models added by hand to the model list, tidied from the seed `manual_models`. One row per model_name."
    columns:
      - name: model_name
        description: "Primary key."
        data_tests:
          - unique
          - not_null

  - name: stg_manual__benchmarks
    description: "Hand-entered benchmark definitions, tidied from the seed `manual_benchmarks`. One row per benchmark_id."
    columns:
      - name: benchmark_id
        description: "Primary key."
        data_tests:
          - unique
          - not_null
