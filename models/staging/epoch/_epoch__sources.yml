version: 2

sources:
  - name: epoch
    description: "Epoch AI 'Notable AI models' dataset (CC-BY 4.0; credit Epoch AI). CSV from https://epoch.ai/data/notable_ai_models.csv, uploaded to Databricks by hand in November 2026 (see CONVENTIONS.md section 8 for the upload settings)."
    database: workspace
    schema: raw_epoch
    tables:
      - name: notable_ai_models
        description: "One row per notable AI model, exactly as published by Epoch."
      - name: benchmark_rows
        description: >
          Epoch AI's benchmark hub (https://epoch.ai/benchmarks, CC BY 4.0), loaded once on
          14 Nov 2026 by `ingestion/ingest_epoch_benchmarks.py` as the historical baseline. Not
          refreshed: new results come from model release pages via the `manual` source, so there
          is no freshness check. One row per CSV row: `file_name` (path inside benchmark_data.zip),
          `row_number`, `raw_json` (the row as a JSON object of strings, untouched), `loaded_at`.
