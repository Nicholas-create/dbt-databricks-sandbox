version: 2

models:
  - name: dim_models
    description: "One row per AI model, ready for reporting. Source: the model list, seed manual_models."
    columns:
      - name: model_name
        description: "Primary key."
        data_tests:
          - unique
          - not_null
      - name: access_type
        description: "How the model is made available. 'Unknown' where the model list leaves it blank."
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - 'Unreleased'
                  - 'API access'
                  - 'Hosted access (no API)'
                  - 'Limited access'
                  - 'Open weights (unrestricted)'
                  - 'Open weights (non-commercial)'
                  - 'Open weights (restricted use)'
                  - 'Unknown'
      - name: is_open_weights
        description: "True if weights are downloadable in any form. Null where access is unknown."
  - name: fct_model_prices_daily
    description: "One row per OpenRouter model per snapshot date, with its match in the model list where one exists. All OpenRouter models are kept; unmatched ones have a null model_name. Prices in USD per million tokens, rounded to 4 dp."
    columns:
      - name: model_snapshot_key
        description: "openrouter_model_id + snapshot_date. Primary key."
        data_tests:
          - unique
          - not_null
      - name: openrouter_model_id
        data_tests:
          - not_null
      - name: snapshot_date
        data_tests:
          - not_null
      - name: model_name
        description: "Matched model from the model list (dim_models). Null when unmatched."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_models')
                field: model_name
      - name: pricing_variant
        data_tests:
          - accepted_values:
              arguments:
                values: ['standard', 'batch', 'free']
      - name: is_variable_priced
        description: "True when OpenRouter reported a placeholder (-1) price, e.g. for routers whose price depends on the model routed to. Those prices are null, not 0."
        data_tests:
          - not_null
      - name: output_price_usd_per_mtok
        description: "Null when variable-priced. 0 means free."

  - name: rpt_models_latest_price
    description: "One row per model in the model list with its latest standard OpenRouter price. Where several listings match, the main listing wins over dated checkpoints and previews, then the cheaper one. Unpriced models are kept (has_price = false)."
    columns:
      - name: model_name
        description: "Primary key. Matches dim_models."
        data_tests:
          - unique
          - not_null
      - name: published_date
        description: "Release date from the model list."
        data_tests:
          - not_null
      - name: has_price
        data_tests:
          - not_null
      - name: standard_listings
        description: "How many standard OpenRouter listings matched this model. Above 1 means the tie-break chose one."
      - name: price_as_of_date
        description: "Snapshot date the price comes from. Older than the latest snapshot means OpenRouter has delisted the listing."

  - name: dim_benchmarks
    description: "One row per benchmark (seed manual_benchmarks), with its category, scale, coverage and weight in the combined Overall scores. The site shows those whose category is_on_site."
    columns:
      - name: benchmark_id
        description: "Primary key."
        data_tests:
          - unique
          - not_null
      - name: category
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('benchmark_categories')
                field: category_id
      - name: is_on_site
        description: "From the category: false = kept in the database but not exported to the site (e.g. internal evaluations)."
        data_tests:
          - not_null
      - name: unit
        data_tests:
          - accepted_values:
              arguments:
                values: ['pct', 'points', 'index']
      - name: released_date
        description: "When the benchmark (this version) was published. Sets its recency weight."
        data_tests:
          - not_null
      - name: is_in_combined_scores
        description: "True when the benchmark feeds the combined scores: on the site, a bounded scale (not an open-ended index) and at least two models."
        data_tests:
          - not_null
      - name: age_years
        description: "Years from released_date to the newest model release in the data (the reference date, so weights only change when the data does)."
      - name: recency_weight
        description: "0.5 ^ (age_years / var benchmark_half_life_years), capped at 1: 1 for a new benchmark, 0.5 one half-life later."
      - name: weight_in_category
        description: "Share of its category's combined score (adds up to 1 per category): recency weight, split between versions of the same benchmark family. Null when not in the combined scores."
      - name: weight_in_overall
        description: "Share of the headline Overall (adds up to 1 across all benchmarks): weight_in_category × the category's share (seed benchmark_categories.overall_weight). Null when not in the combined scores."
      - name: n_recent_models
        description: "Models released in the last 180 days (from build date) with a score."
      - name: leader_headroom
        description: "1 minus the average of the 5 best recent scores as a share of the scale. Near 0 = saturated."
      - name: relevance_score
        description: "n_recent_models × leader_headroom: is it in use, and can it still separate the leaders?"
      - name: relevance_rank
        description: "Order within the category by relevance alone, 1 = most relevant. Depends on the build date, by design."
        data_tests:
          - not_null
      - name: benchmark_family
        description: "Versions of one benchmark share a family and appear as one split pill. A standalone benchmark is its own family."
        data_tests:
          - not_null
      - name: variant_label
        description: "This version's label inside the split pill (e.g. '2.0'). Null for standalone benchmarks."
      - name: display_rank
        description: "Pill order on the site: families placed by their most relevant version, versions kept together."
        data_tests:
          - not_null

  - name: fct_benchmark_scores
    description: >
      One row per benchmark per model: the score the site shows (seed manual_benchmark_scores).
      Scores in site units: a share 0-1 for pct benchmarks.
    columns:
      - name: benchmark_model_key
        description: "benchmark_id + normalised model name. Primary key."
        data_tests:
          - unique
          - not_null
      - name: benchmark_id
        description: "A typo in a manual entry fails here rather than disappearing."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_benchmarks')
                field: benchmark_id
      - name: score
        data_tests:
          - not_null
      - name: source_type
        description: "vendor_reported (the developer about its own model) or independent (a leaderboard or third-party run). The site marks vendor_reported scores with *."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['vendor_reported', 'independent']

  - name: fct_benchmark_category_scores
    description: >
      Combined scores from weighted item response theory fits (dbt Python model): one per category
      per model (the category's 'Overall' pill; at least min_results results in the category), and
      one per model with category = 'overall' (the headline Overall tab: one pooled fit across every
      category; at least min_results results in at least two categories). Weights come from
      dim_benchmarks.
    columns:
      - name: category_model_key
        description: "category + normalised model name. Primary key."
        data_tests:
          - unique
          - not_null
      - name: score
        description: "Share of tasks the model would solve on a typical benchmark of this category, or of all categories for 'overall' (0-1)."
        data_tests:
          - not_null
