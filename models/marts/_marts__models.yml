version: 2

models:
  - name: dim_models
    description: "One row per notable AI model, ready for reporting. Source: Epoch AI (CC-BY 4.0)."
    columns:
      - name: model_name
        description: "Primary key."
        data_tests:
          - unique
          - not_null
      - name: access_type
        description: "How the model is made available. 'Unknown' where Epoch has no data."
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - 'Unreleased'
                  - 'API access'
                  - 'Hosted access (no API)'
                  - 'Limited access'
                  - 'Open weights (unrestricted)'
                  - 'Open weights (non-commercial)'
                  - 'Open weights (restricted use)'
                  - 'Unknown'
      - name: is_open_weights
        description: "True if weights are downloadable in any form. Null where access is unknown."
  - name: fct_model_prices_daily
    description: "One row per OpenRouter model per snapshot date, with its Epoch match where one exists. All OpenRouter models are kept; unmatched ones have a null epoch_model_name. Prices in USD per million tokens, rounded to 4 dp."
    columns:
      - name: model_snapshot_key
        description: "openrouter_model_id + snapshot_date. Primary key."
        data_tests:
          - unique
          - not_null
      - name: openrouter_model_id
        data_tests:
          - not_null
      - name: snapshot_date
        data_tests:
          - not_null
      - name: epoch_model_name
        description: "Matched Epoch model. Null when unmatched."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_models')
                field: model_name
      - name: pricing_variant
        data_tests:
          - accepted_values:
              arguments:
                values: ['standard', 'batch', 'free']
      - name: is_variable_priced
        description: "True when OpenRouter reported a placeholder (-1) price, e.g. for routers whose price depends on the model routed to. Those prices are null, not 0."
        data_tests:
          - not_null
      - name: output_price_usd_per_mtok
        description: "Null when variable-priced. 0 means free."

  - name: rpt_models_latest_price
    description: "One row per Epoch model with its latest standard OpenRouter price. Where several listings match, the main listing wins over dated checkpoints and previews, then the cheaper one. Unpriced models are kept (has_price = false)."
    columns:
      - name: model_name
        description: "Primary key. Matches dim_models."
        data_tests:
          - unique
          - not_null
      - name: published_date
        description: "Release date from Epoch AI. The website plots models along this axis."
        data_tests:
          - not_null
      - name: has_price
        data_tests:
          - not_null
      - name: standard_listings
        description: "How many standard OpenRouter listings matched this Epoch model. Above 1 means the tie-break chose one."
      - name: price_as_of_date
        description: "Snapshot date the price comes from. Older than the latest snapshot means OpenRouter has delisted the listing."

  - name: dim_benchmarks
    description: "One row per benchmark the site can show (Epoch catalog seed or hand-entered definition), with its category, scale and coverage."
    columns:
      - name: benchmark_id
        description: "Primary key."
        data_tests:
          - unique
          - not_null
      - name: category
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('benchmark_categories')
                field: category_id
      - name: unit
        data_tests:
          - accepted_values:
              arguments:
                values: ['pct', 'points', 'index']
      - name: defined_in
        description: "epoch_catalog, manual, or epoch_catalog+manual (manual overrides the display details)."
      - name: n_recent_models
        description: "Models released in the last 180 days (from build date) with a score."
      - name: leader_headroom
        description: "1 minus the average of the 5 best recent scores as a share of the scale. Near 0 = saturated."
      - name: relevance_score
        description: "n_recent_models × leader_headroom: is it in use, and can it still separate the leaders?"
      - name: relevance_rank
        description: "Order within the category, 1 = most relevant (leftmost pill after Overall). Depends on the build date, by design."
        data_tests:
          - not_null

  - name: fct_benchmark_scores
    description: >
      One row per benchmark per model: the score the site shows. Sources: Epoch AI (CC BY 4.0)
      and hand-entered results, which supersede Epoch's for the same benchmark and model.
      Scores in site units: a share 0-1 for pct benchmarks.
    columns:
      - name: benchmark_model_key
        description: "benchmark_id + normalised model name. Primary key."
        data_tests:
          - unique
          - not_null
      - name: benchmark_id
        description: "A typo in a manual entry fails here rather than disappearing."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_benchmarks')
                field: benchmark_id
      - name: score
        data_tests:
          - not_null
      - name: score_source
        description: "epoch = Epoch's collected run; manual = entered by hand in raw_manual.benchmark_scores."
        data_tests:
          - accepted_values:
              arguments:
                values: ['epoch', 'manual']
      - name: source_type
        description: "Manual rows only: vendor_reported (the developer about its own model) or independent."
        data_tests:
          - accepted_values:
              arguments:
                values: ['vendor_reported', 'independent']

  - name: fct_benchmark_category_scores
    description: "One 'Overall' score per category per model, from an item response theory fit across the category's benchmarks (dbt Python model). Models need at least min_results scores in the category."
    columns:
      - name: category_model_key
        description: "category + normalised model name. Primary key."
        data_tests:
          - unique
          - not_null
      - name: score
        description: "Share of tasks the model would solve on a typical benchmark of this category (0-1)."
        data_tests:
          - not_null
