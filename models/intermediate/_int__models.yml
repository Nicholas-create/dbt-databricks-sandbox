version: 2

models:
  - name: int_models__unioned
    description: >
      Every model the project knows about: Epoch's notable-models file plus models added by hand
      in the seed manual_models. One row per model_name. A value filled in by hand wins on a clash;
      Epoch fills the rest.
    columns:
      - name: model_name
        description: "Primary key."
        data_tests:
          - unique
          - not_null
      - name: model_source
        description: "Where the row comes from: epoch, manual, or epoch+manual (listed in both; the hand-entered values win)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['epoch', 'manual', 'epoch+manual']
  - name: int_models__matched
    description: "One row per OpenRouter model, mapped to a model in the model list (Epoch or added by hand) where possible. Manual overrides take priority over automatic name matching."
    columns:
      - name: openrouter_model_id
        description: "Primary key."
        data_tests:
          - unique
          - not_null
      - name: epoch_model_name
        description: "Matched model from int_models__unioned (Epoch or added by hand; the name predates the manual list). Null when unmatched."
        data_tests:
          - relationships:
              arguments:
                to: ref('int_models__unioned')
                field: model_name
      - name: match_method
        data_tests:
          - accepted_values:
              arguments:
                values: ['manual', 'automatic', 'unmatched']
      - name: pricing_variant
        data_tests:
          - accepted_values:
              arguments:
                values: ['standard', 'batch', 'free']
  - name: int_benchmarks__unioned
    description: "Every benchmark: the Epoch catalog seed plus hand-entered definitions. A manual row overrides display details; the seed still says how to read Epoch's file."
    columns:
      - name: benchmark_id
        description: "Primary key."
        data_tests:
          - unique
          - not_null

  - name: int_benchmark_scores__epoch
    description: >
      Epoch results, one row per benchmark per model: the model's best run. Model names are
      resolved through Epoch's own version → name map, then the file's display name, then the
      readable version string. Scores in site units (share 0-1 for pct benchmarks).
    columns:
      - name: benchmark_model_key
        description: "benchmark_id + model_key. Primary key."
        data_tests:
          - unique
          - not_null

  - name: int_benchmark_scores__unioned
    description: "Epoch and manual scores together, one row per benchmark per model. A manual entry supersedes Epoch's score for the same key; deleting the seed line brings Epoch's score back."
    columns:
      - name: benchmark_model_key
        description: "Primary key."
        data_tests:
          - unique
          - not_null
      - name: score_source
        data_tests:
          - accepted_values:
              arguments:
                values: ['epoch', 'manual']
