name: 'ai_model_tracker'
version: '1.0.0'
config-version: 2

# Profile name in ~/.dbt/profiles.yml (local) or the profile CI writes at run time.
profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# One materialisation per layer (CONVENTIONS.md §1): staging and intermediate
# are cheap views over raw data; marts are tables, because dashboards and the
# website query them.
models:
  ai_model_tracker:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

vars:
  # Overall scores (dim_benchmarks → fct_benchmark_category_scores): a benchmark's
  # weight halves for every this many years since it was released. 1.5 years: a
  # 3-year-old benchmark counts a quarter as much as a new one. Frontier
  # benchmarks typically go from hard to saturated in one to three years.
  benchmark_half_life_years: 1.5
