name: 'ai_model_tracker'
version: '1.0.0'
config-version: 2

# Profile name in ~/.dbt/profiles.yml (local) or the profile CI writes at run time.
profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# One materialisation per layer (CONVENTIONS.md §1): staging and intermediate
# are cheap views over raw data; marts are tables, because dashboards and the
# website query them.
models:
  ai_model_tracker:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
